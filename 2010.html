<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Món quà 20/10 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* ================== CHỈNH SỬA Ở ĐÂY (xem phần CONFIG trong <script>) ================== */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Quicksand', sans-serif; background: #000; }
  .scene { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; }
  .scene.active { display: flex; animation: fadeIn .8s ease; }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }

  /* ---------- CẢNH 1: MỞ QUÀ ---------- */
  #intro { background: radial-gradient(circle at 50% 40%, #ffe3ec 0%, #ffc2d4 55%, #ff9fbd 100%); flex-direction: column; gap: 18px; }
  #intro .bouquet { width: min(70vw, 300px); aspect-ratio: 300 / 380; transform-origin: 50% 90%;
                    filter: drop-shadow(0 14px 22px rgba(200,50,100,.35)); }
  #intro .bouquet.done { animation: sway 3.2s ease-in-out infinite; }
  #intro .bouquet svg { width: 100%; height: 100%; overflow: visible; }
  @keyframes sway { 0%,100% { transform: rotate(-3deg) } 50% { transform: rotate(3deg) translateY(-6px) } }
  /* từng bộ phận bó hoa bay vào ghép lại */
  .part { transform-box: fill-box; transform-origin: center; opacity: 0;
          transition: transform 1.1s cubic-bezier(.2,.9,.3,1.15), opacity .5s; }
  .part.in { opacity: 1; transform: none !important; }
  #intro .reveal { opacity: 0; transform: translateY(10px); transition: .6s; pointer-events: none; }
  #intro.ready .reveal { opacity: 1; transform: none; pointer-events: auto; }
  .btn { border: none; cursor: pointer; padding: 12px 30px; border-radius: 999px; font: 700 17px 'Quicksand'; color: #fff;
         background: linear-gradient(135deg, #ff5c8a, #ff8fb1); box-shadow: 0 6px 20px rgba(255,70,120,.45); transition: transform .2s; }
  .btn:hover { transform: scale(1.06); }
  .btn:active { transform: scale(.96); }
  #intro .hint { color: #c2477a; font-size: 14px; animation: blink 1.6s infinite; }
  @keyframes blink { 50% { opacity: .35 } }

  /* ---------- CẢNH 2: THIỆP HỒNG ---------- */
  #card { background: linear-gradient(160deg, #ffe6ee, #ffc9d9 50%, #ffb3c9); overflow: hidden; }
  #card .glow { position: absolute; width: 70vmin; height: 70vmin; border-radius: 50%;
                background: radial-gradient(circle, rgba(255,255,255,.75), rgba(255,255,255,0) 70%); }
  .cupid { position: absolute; top: 14px; font-size: 54px; animation: fly 3s ease-in-out infinite; }
  .cupid.l { left: 18px; } .cupid.r { right: 18px; transform: scaleX(-1); animation-delay: -1.5s; }
  @keyframes fly { 50% { margin-top: 12px } }
  .wing-heart { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-size: 46px; display: flex; align-items: center; }
  .wing-heart span { line-height: 0; display: inline-block; animation: flap 1s ease-in-out infinite; }
  .wing-heart span.r { transform: scaleX(-1); }
  .wing-heart b { animation: beat 1s infinite; display: inline-block; }
  @keyframes flap { 50% { rotate: 18deg } }
  @keyframes beat { 0%,100% { transform: scale(1) } 30% { transform: scale(1.18) } }
  .balloon { position: absolute; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff 0 8%, #ff9ab8 30%, #ff5c8a 100%);
             box-shadow: 0 8px 18px rgba(255,80,130,.3); animation: floatY 5s ease-in-out infinite; }
  @keyframes floatY { 50% { transform: translateY(-22px) } }
  .sparkle { position: absolute; color: #fff; text-shadow: 0 0 8px #fff; animation: twinkle 2s infinite; }
  @keyframes twinkle { 50% { opacity: .2; transform: scale(.6) } }
  .clouds { position: absolute; bottom: -40px; left: -5%; width: 110%; height: 150px; }
  .clouds i { position: absolute; bottom: 0; background: #fff; border-radius: 50%; filter: blur(2px); opacity: .95; }
  #title { position: relative; z-index: 3; text-align: center; padding: 0 16px; }
  #title h1 { font: 700 clamp(30px, 6vw, 64px) 'Dancing Script', cursive; color: #ff3f7a;
              text-shadow: 0 2px 0 #fff, 0 0 18px rgba(255,255,255,.9); min-height: 1.3em; }
  #title h2 { font: 700 clamp(26px, 5vw, 52px) 'Dancing Script', cursive; color: #e8336d; margin-top: 6px;
              text-shadow: 0 2px 0 #fff; min-height: 1.3em; }
  .caret::after { content: '|'; animation: blink .8s infinite; color: #ff3f7a; }
  #heartTrail { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  #letterBtn { position: absolute; left: 18px; bottom: 18px; z-index: 5; font-size: 40px; background: #fff; width: 64px; height: 64px;
               border-radius: 18px; border: none; cursor: pointer; box-shadow: 0 6px 16px rgba(255,80,130,.35); animation: beat 1.4s infinite; }
  #letterBtn::after { content: 'Mở thư'; position: absolute; left: 72px; top: 50%; transform: translateY(-50%); white-space: nowrap;
                      font: 700 14px 'Quicksand'; color: #d63a6c; background: #fff; padding: 4px 10px; border-radius: 8px; }

  /* ---------- CUỐN VỞ / LÁ THƯ (full màn hình) ---------- */
  #book-wrap { position: absolute; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
               background: rgba(255,200,215,.55); backdrop-filter: blur(4px); perspective: 2000px; }
  #book-wrap.show { display: flex; animation: fadeIn .6s ease; }
  .book { position: relative; width: min(94vw, 760px); height: 92vh; height: 92dvh; transform-style: preserve-3d; }
  /* trang giấy vở: dòng kẻ + lề đỏ + lỗ gáy */
  .paper { position: absolute; inset: 0; border-radius: 6px 14px 14px 6px; box-shadow: 0 14px 40px rgba(200,60,110,.35);
           background:
             linear-gradient(90deg, transparent 54px, #ff8fa8 54px 56px, transparent 56px),
             repeating-linear-gradient(#fffdfd 0 33px, #cfe3ff 33px 34px);
           background-color: #fffdfd; background-attachment: local;
           padding: 34px 26px 90px 74px; overflow-y: auto; scroll-behavior: smooth;
           font: 600 clamp(16px, 2.4vw, 20px)/34px 'Quicksand'; color: #b23a64;
           scrollbar-width: thin; scrollbar-color: #ff9ab8 transparent; }
  .paper::-webkit-scrollbar { width: 5px; }
  .paper::-webkit-scrollbar-thumb { background: #ff9ab8; border-radius: 4px; }
  .paper p { margin: 0; }
  .paper .sign { font: 700 clamp(24px, 4vw, 32px)/34px 'Dancing Script'; text-align: right; margin-top: 34px; color: #e8336d; }
  .paper .end { text-align: center; margin-top: 34px; }
  .rings { position: absolute; left: -10px; top: 20px; bottom: 20px; width: 34px; z-index: 6; pointer-events: none;
           display: flex; flex-direction: column; justify-content: space-around; }
  .rings i { position: relative; display: block; height: 14px; border-radius: 8px; background: linear-gradient(#e6e6ea, #9a9aa5);
             box-shadow: 0 2px 3px rgba(0,0,0,.25); }
  .rings i::before { content: ''; position: absolute; left: 22px; width: 10px; height: 10px; margin-top: 2px; border-radius: 50%;
                     background: #e9c3cf; box-shadow: inset 0 1px 2px rgba(0,0,0,.35); }
  /* bìa vở = ảnh cô gái */
  .cover { position: absolute; inset: 0; z-index: 5; transform-origin: left center; transform-style: preserve-3d; cursor: pointer;
           transition: transform 1.5s cubic-bezier(.6,.1,.3,1), opacity .2s; }
  .cover > div { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 6px 14px 14px 6px; overflow: hidden; }
  .cover .front img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover .front .ph { width: 100%; height: 100%; font-size: 120px; }
  .ph { display: flex; align-items: center; justify-content: center; font-size: 80px; background: linear-gradient(135deg,#ffc2d4,#ff8fb1); }
  .cover .label { position: absolute; left: 0; right: 0; bottom: 0; padding: 60px 20px 26px; text-align: center; color: #fff;
                  background: linear-gradient(transparent, rgba(120,10,50,.65)); font: 700 clamp(30px, 6vw, 46px) 'Dancing Script'; }
  .cover .label small { display: block; font: 600 14px 'Quicksand'; opacity: .9; animation: blink 1.6s infinite; }
  .cover .back { background: #ffeaf1; transform: rotateY(180deg); }
  .book.open .cover { transform: rotateY(-180deg); opacity: 0; pointer-events: none;
                      transition: transform 1.5s cubic-bezier(.6,.1,.3,1), opacity .4s 1.1s; }

  /* ---------- CẢNH 3: LOADING ---------- */
  #loading { background: #000; flex-direction: column; gap: 14px; }
  #loading p { font: 700 30px 'Dancing Script'; color: #ff4f9a; text-shadow: 0 0 6px #ff4f9a, 0 0 18px #ff1f7a, 0 0 36px #ff1f7a; }
  .bar { width: min(60vw, 260px); height: 6px; border-radius: 6px; background: #2a0b18; overflow: hidden; box-shadow: 0 0 12px #ff1f7a55; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ff2f86, #ff9ac6); box-shadow: 0 0 10px #ff2f86; }
  #loading small { color: #ff8fc0; font-size: 13px; }

  /* ---------- CẢNH 4: TRÁI TIM 3D ---------- */
  #final { background: #000; }
  #final canvas { position: absolute; inset: 0; }
  .ring-wrap { position: absolute; bottom: 6%; left: 50%; transform: translateX(-50%); width: 140px; height: 110px; perspective: 900px; z-index: 3; }
  .ring { position: absolute; inset: 0; transform-style: preserve-3d; animation: spin 14s linear infinite; }
  .ring div { position: absolute; inset: 0; border-radius: 10px; overflow: hidden; border: 2px solid #ffd1e3; box-shadow: 0 0 16px #ff4f9a99;
              background: #ffc2d4; -webkit-box-reflect: below 6px linear-gradient(transparent 60%, rgba(255,255,255,.25)); }
  .ring img { width: 100%; height: 100%; object-fit: cover; }
  @keyframes spin { from { transform: rotateX(-8deg) rotateY(0) } to { transform: rotateX(-8deg) rotateY(360deg) } }
  #bigText { position: absolute; top: 8%; width: 100%; text-align: center; z-index: 3; font: 700 clamp(30px, 6vw, 60px) 'Dancing Script';
             color: #ffd6ea; text-shadow: 0 0 8px #ff4f9a, 0 0 20px #ff1f7a, 0 0 40px #ff1f7a; transition: opacity 1s; }
  #musicBtn { position: fixed; top: 12px; right: 12px; z-index: 50; width: 40px; height: 40px; border-radius: 50%; border: none;
              background: rgba(255,255,255,.75); font-size: 18px; cursor: pointer; display: none; }
</style>
</head>
<body>

<!-- CẢNH 1 -->
<section id="intro" class="scene active">
  <div class="bouquet" id="bouquet"><svg id="bouquetSvg" viewBox="0 0 300 380"></svg></div>
  <button class="btn reveal" id="openGift">Mở quà 🎁</button>
  <div class="hint reveal">Chạm vào để mở nha...</div>
</section>

<!-- CẢNH 2 -->
<section id="card" class="scene">
  <div class="glow"></div>
  <div class="cupid l">👼🏹</div>
  <div class="cupid r">👼🏹</div>
  <div class="wing-heart">
    <span><svg width="48" height="34" viewBox="0 0 48 34"><path d="M46 20C38 6 22 0 2 4c6 3 9 6 10 8-5 0-8 1-10 3 6 1 10 3 12 5-4 1-6 3-7 5 12 2 26 0 39-5z" fill="#fff" stroke="#ffb3c9" stroke-width="2"/></svg></span>
    <b>💗</b>
    <span class="r"><svg width="48" height="34" viewBox="0 0 48 34"><path d="M46 20C38 6 22 0 2 4c6 3 9 6 10 8-5 0-8 1-10 3 6 1 10 3 12 5-4 1-6 3-7 5 12 2 26 0 39-5z" fill="#fff" stroke="#ffb3c9" stroke-width="2"/></svg></span>
  </div>
  <div id="deco"></div>
  <div class="clouds" id="clouds"></div>
  <canvas id="heartTrail"></canvas>
  <div id="title"><h1 id="t1"></h1><h2 id="t2"></h2></div>
  <button id="letterBtn" style="display:none">💌</button>


  <div id="book-wrap">
    <div class="book" id="book">
      <div class="paper" id="paper">
        <div id="letterText"></div>
        <div class="sign" id="letterSign"></div>
        <div class="end"><button class="btn" id="nextBtn" style="display:none">Còn nữa nè ➜</button></div>
      </div>
      <div class="rings" id="rings"></div>
      <div class="cover" id="cover">
        <div class="front" id="coverPhoto"><div class="label">Gửi em 💝<small>Chạm để mở vở</small></div></div>
        <div class="back"></div>
      </div>
    </div>
  </div>
</section>

<!-- CẢNH 3 -->
<section id="loading" class="scene">
  <p>Loading...</p>
  <div class="bar"><i id="barFill"></i></div>
  <small id="pct">0%</small>
</section>

<!-- CẢNH 4 -->
<section id="final" class="scene">
  <canvas id="space"></canvas>
  <div id="bigText"></div>
  <div class="ring-wrap"><div class="ring" id="ring"></div></div>
</section>

<button id="musicBtn">🎵</button>
<audio id="bgm" loop></audio>

<script>
/* =====================================================================
   CONFIG — sửa nội dung tại đây
   - Bỏ ảnh vào cùng thư mục, đặt tên anh1.jpg, anh2.jpg ... (hoặc đổi tên bên dưới)
   - Bỏ file nhạc music.mp3 vào cùng thư mục (không có cũng không sao)
   ===================================================================== */
const CONFIG = {
  title: "Happy Vietnamese Women's Day 20/10",
  name: "Thùy Linh ❤",
  letter: [
    "Gửi em, cô gái anh thương nhất 💕",
    "Nhân ngày 20/10, anh chúc em luôn xinh đẹp, vui vẻ và hạnh phúc.",
    "Mong rằng nụ cười sẽ luôn nở trên môi em.",
    "Yêu em nhiều lắm! 🥰"
  ],
  sign: "Người yêu em ♡",
  photos: ["anh1.jpg", "anh2.jpg", "anh3.jpg", "anh4.jpg", "anh5.jpg", "anh6.jpg"],
  music: "music.mp3",
  // Dán link YouTube của bài hát vào đây (để trống "" thì dùng file music.mp3 ở trên)
  youtube: "https://www.youtube.com/shorts/dPkRwXX3oKU",
  youtubeStart: 0,   // bắt đầu phát từ giây thứ mấy
  floatTexts: [
  "Bé cưng 20/10 vui vẻ 🌷",
  "Hôm nay em là nhất trần đời 👑",
  "Ăn ngoan, ngủ ngoan nhé",
  "Xinh đẹp số 1 thế giới ✨",
  "Cười lên cái nào 🥰",
  "Thương em nhất quả đất 💖",
  "Có anh ở đây rồi nè",
  "Yêu công chúa nhiều lắmm 💕",
  "20/10 rực rỡ 🌹",
  "Yêu em 💕",
  "Always smile ✨",
  "Bé cưng 💖",
  "My princess 👑",
  "Hạnh phúc nhé 🌸",
  "Thương em 🥰",
  "Only you 💫"
],
  bigTexts: [
  "Chúc em 20/10 thật hạnh phúc 🌹",
  "Cảm ơn Công chúa ✨",
  "Yêu em nhiều 💕",
  "Mãi là công chúa của anh nhé 👑"
]
};

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
function go(id) { document.querySelectorAll('.scene').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); }

// Ảnh: nếu không tìm thấy file thì hiện khung hồng thay thế
function makePhoto(src, emoji = '💖') {
  const img = new Image();
  img.src = src; img.alt = '';
  img.onerror = () => { const d = document.createElement('div'); d.className = 'ph'; d.textContent = emoji; img.replaceWith(d); };
  return img;
}

// Nhạc: ưu tiên YouTube nếu có link, không thì dùng file mp3
const bgm = $('bgm');
const setIcon = on => $('musicBtn').textContent = on ? '🎵' : '🔇';
const ytId = (CONFIG.youtube.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/) || [])[1]
          || (/^[\w-]{11}$/.test(CONFIG.youtube.trim()) ? CONFIG.youtube.trim() : '');
let yt = null, ytReady = false, ytWant = false, ytPlaying = false;
const music = {
  play() {
    const show = () => $('musicBtn').style.display = 'block';
    if (ytId) { show(); ytWant = true; if (ytReady) yt.playVideo(); return; }
    bgm.play().then(show).catch(() => {});
  },
  toggle() {
    if (ytId) { if (!ytReady) return; ytPlaying ? yt.pauseVideo() : yt.playVideo(); return; }
    bgm.paused ? bgm.play() : bgm.pause();
  }
};
if (ytId) {
  const box = document.createElement('div');
  box.id = 'yt';
  box.style.cssText = 'position:fixed;left:-9999px;top:0;width:200px;height:200px;opacity:0;pointer-events:none';
  document.body.appendChild(box);
  window.onYouTubeIframeAPIReady = () => {
    yt = new YT.Player('yt', {
      videoId: ytId,
      playerVars: { autoplay: 0, controls: 0, loop: 1, playlist: ytId, start: CONFIG.youtubeStart | 0, playsinline: 1 },
      events: {
        onReady: () => { ytReady = true; yt.setVolume(100); if (ytWant) yt.playVideo(); },
        onStateChange: e => { ytPlaying = e.data === YT.PlayerState.PLAYING; if (e.data !== YT.PlayerState.BUFFERING) setIcon(ytPlaying); }
      }
    });
  };
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
} else {
  bgm.src = CONFIG.music;
}
$('musicBtn').onclick = () => music.toggle();
bgm.onplay = () => setIcon(true);
bgm.onpause = () => setIcon(false);


/* ---------------- BÓ HOA SVG (ghép từng phần) ---------------- */
function buildBouquet() {
  const svg = $('bouquetSvg');
  const R = (a, b) => a + Math.random() * (b - a);
  // Bảng màu hoa: [đáy cánh (đậm), mép cánh (sáng), nhụy]
  const COLORS = {
    red:   ['#8e0a24', '#e8344f', '#5e0618'],
    pink:  ['#c2185b', '#ff8fb5', '#8a0f40'],
    light: ['#e86a92', '#ffe0ea', '#c94a74'],
    peach: ['#e2725b', '#ffd3c2', '#b4513d']
  };
  let defs = '<defs>';
  for (const [k, [a, b, c]] of Object.entries(COLORS)) {
    defs += `<linearGradient id="pt-${k}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${a}"/><stop offset=".75" stop-color="${b}"/><stop offset="1" stop-color="${b}" stop-opacity=".9"/></linearGradient>
             <radialGradient id="ct-${k}"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="${a}"/></radialGradient>`;
  }
  defs += `<linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc46b"/><stop offset="1" stop-color="#2e7d32"/></linearGradient>
    <linearGradient id="stem" x1="0" x2="1"><stop offset="0" stop-color="#4f9a3f"/><stop offset="1" stop-color="#2b6b25"/></linearGradient>
    <linearGradient id="paperBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4f7"/><stop offset="1" stop-color="#f7c6d6"/></linearGradient>
    <linearGradient id="paperFront" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f48fb1"/><stop offset=".5" stop-color="#ffc1d6"/><stop offset="1" stop-color="#ec7aa3"/></linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5c8a"/><stop offset="1" stop-color="#c2185b"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#5a0a20" flood-opacity=".35"/></filter>
  </defs>`;

  const petal = (r, w = .62) =>
    `M0 0 C${r * w} ${-r * .15},${r * w * .95} ${-r * .85},0 ${-r} C${-r * w * .95} ${-r * .85},${-r * w} ${-r * .15},0 0Z`;

  // Hoa hồng: 3 vòng cánh + nụ xoắn ở giữa
  function rose(cx, cy, r, color) {
    r *= 1.2;   // hoa to hơn chút cho bó đầy đặn
    let g = `<g class="part" filter="url(#soft)"><g transform="translate(${cx} ${cy})">`;
    const rings = [[6, 1, 0], [5, .78, 30], [4, .55, 12]];
    for (const [n, k, off] of rings) {
      for (let i = 0; i < n; i++) {
        const a = off + i * 360 / n + R(-8, 8);
        g += `<path d="${petal(r * k * R(.92, 1.05))}" transform="rotate(${a})" fill="url(#pt-${color})"
               stroke="${COLORS[color][0]}" stroke-opacity=".35" stroke-width=".6"/>`;
      }
    }
    g += `<circle r="${r * .32}" fill="url(#ct-${color})"/>`;
    // đường xoắn cánh trong cùng
    const c = COLORS[color][1];
    g += `<path d="M${-r * .22} 0 A${r * .22} ${r * .22} 0 1 1 ${r * .1} ${r * .2}" fill="none" stroke="${c}" stroke-width="1.4" opacity=".8"/>
          <path d="M${r * .12} ${-r * .05} A${r * .12} ${r * .12} 0 1 1 ${-r * .08} ${r * .1}" fill="none" stroke="${c}" stroke-width="1.1" opacity=".7"/>`;
    return g + '</g></g>';
  }
  const leaf = (x, y, rot, s = 1) =>
    `<g class="part"><g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})">
       <path d="M0 0 C14 -10,16 -36,0 -56 C-16 -36,-14 -10,0 0Z" fill="url(#leaf)"/>
       <path d="M0 -2 L0 -52" stroke="#a5d6a7" stroke-width="1" opacity=".7"/></g></g>`;
  // Hoa bi trắng
  function babyBreath(x, y) {
    let g = `<g class="part">`;
    for (let i = 0; i < 9; i++) {
      const dx = R(-14, 14), dy = R(-14, 10);
      g += `<path d="M${x} ${y + 16} L${x + dx} ${y + dy}" stroke="#8bbf7a" stroke-width=".8"/>
            <circle cx="${x + dx}" cy="${y + dy}" r="${R(2.2, 3.4)}" fill="#fff" stroke="#f3dbe4" stroke-width=".5"/>`;
    }
    return g + '</g>';
  }

  // Thứ tự ghép: giấy sau → lá → cành → hoa → hoa bi → giấy trước → nơ
  const parts = [];
  parts.push(`<g class="part"><path d="M22 150 Q30 52 92 34 Q150 14 208 34 Q270 52 278 150 L160 318 L140 318 Z" fill="url(#paperBack)" stroke="#f3b6c9"/></g>`);
  [[60, 150, -55], [240, 150, 55], [92, 105, -25, .9], [208, 105, 25, .9], [42, 120, -75, .8], [258, 120, 75, .8], [150, 60, 0, .7]]
    .forEach(a => parts.push(leaf(...a)));
  parts.push(`<g class="part">${[-14, -7, 0, 7, 14].map(d => `<path d="M${150 + d * 3} 210 L${150 + d * .8} 372" stroke="url(#stem)" stroke-width="4" stroke-linecap="round"/>`).join('')}</g>`);
  [[150, 92, 34, 'red'], [100, 112, 29, 'pink'], [200, 112, 29, 'pink'], [124, 152, 28, 'red'],
   [178, 152, 28, 'red'], [66, 150, 23, 'light'], [234, 150, 23, 'light'], [150, 52, 24, 'peach'],
   [112, 66, 21, 'light'], [190, 66, 21, 'light'], [150, 140, 22, 'pink']]
    .forEach(a => parts.push(rose(...a)));
  [[78, 96], [222, 96], [150, 116], [44, 132], [256, 132], [130, 40], [172, 40]].forEach(a => parts.push(babyBreath(...a)));
  parts.push(`<g class="part"><path d="M36 168 Q150 222 264 168 L168 322 L132 322 Z" fill="url(#paperFront)" stroke="#e46a95"/>
    <path d="M150 210 L150 320 M100 196 L140 318 M200 196 L160 318" stroke="#fff" stroke-opacity=".45" stroke-width="1.2" fill="none"/></g>`);
  parts.push(`<g class="part"><g transform="translate(150 300)">
    <path d="M0 0 C-30 -26,-52 -4,-38 10 C-28 20,-10 8,0 0Z" fill="url(#ribbon)"/>
    <path d="M0 0 C30 -26,52 -4,38 10 C28 20,10 8,0 0Z" fill="url(#ribbon)"/>
    <path d="M-4 4 L-22 46 L-12 40 L-6 50 L2 6Z M4 4 L22 46 L12 40 L6 50 L-2 6Z" fill="#d81b60"/>
    <ellipse rx="9" ry="8" fill="#ff7aa2"/></g></g>`);

  svg.innerHTML = defs + parts.join('');

  // Đặt mỗi phần ở vị trí ngẫu nhiên rồi lần lượt bay về ghép thành bó
  const els = [...svg.querySelectorAll('.part')];
  els.forEach(el => {
    const a = R(0, Math.PI * 2), d = R(220, 420);
    el.style.transform = `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d}px) rotate(${R(-200, 200)}deg) scale(${R(.2, .6)})`;
  });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    els.forEach((el, i) => setTimeout(() => el.classList.add('in'), 300 + i * 110));
    setTimeout(() => { $('bouquet').classList.add('done'); $('intro').classList.add('ready'); }, 300 + els.length * 110 + 1100);
  }));
}

/* ---------------- CẢNH 2: trang trí ---------------- */
function buildDeco() {
  const deco = $('deco');
  const balloons = [[8, 62, 46], [86, 30, 38], [78, 66, 34], [20, 28, 26], [60, 80, 22]];
  balloons.forEach(([x, y, s], i) => {
    const b = document.createElement('div');
    b.className = 'balloon';
    Object.assign(b.style, { left: x + '%', top: y + '%', width: s + 'px', height: s + 'px', animationDelay: -i * 1.1 + 's' });
    deco.appendChild(b);
  });
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle'; s.textContent = '✦';
    Object.assign(s.style, { left: Math.random() * 96 + '%', top: Math.random() * 85 + '%',
      fontSize: 10 + Math.random() * 18 + 'px', animationDelay: -Math.random() * 2 + 's' });
    deco.appendChild(s);
  }
  const clouds = $('clouds');
  for (let i = 0; i < 14; i++) {
    const c = document.createElement('i');
    const w = 90 + Math.random() * 120;
    Object.assign(c.style, { left: i * 7.5 - 3 + '%', width: w + 'px', height: w * .75 + 'px', bottom: -w * .25 + Math.random() * 30 + 'px' });
    clouds.appendChild(c);
  }
}

// Hiệu ứng gõ chữ
// scroller: khung cần tự cuộn theo chữ (nếu người xem tự kéo lên đọc lại thì không giật xuống)
async function typeText(el, text, speed = 70, scroller) {
  el.classList.add('caret');
  for (const ch of [...text]) {
    const atBottom = scroller && scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 40;
    el.textContent += ch;
    if (atBottom) scroller.scrollTop = scroller.scrollHeight;
    await sleep(speed);
  }
  el.classList.remove('caret');
}

// Vệt tim bay quanh tiêu đề
function heartTrail() {
  const cv = $('heartTrail'), ctx = cv.getContext('2d');
  let W, H, parts = [], t = 0;
  const resize = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
  resize(); addEventListener('resize', resize);
  (function loop() {
    if (!$('card').classList.contains('active')) return;
    t += 0.025;
    // Điểm phát chạy theo đường cong số 8 quanh chữ
    const ex = W / 2 + Math.sin(t) * W * 0.32, ey = H / 2 + Math.sin(t * 2) * H * 0.12 + 10;
    for (let i = 0; i < 2; i++) parts.push({ x: ex, y: ey, vx: (Math.random() - .5) * 1.6, vy: (Math.random() - .5) * 1.6 - .4,
                                             life: 1, s: 10 + Math.random() * 12 });
    ctx.clearRect(0, 0, W, H);
    parts = parts.filter(p => (p.life -= 0.008) > 0);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy;
      ctx.globalAlpha = p.life;
      ctx.fillStyle = `hsl(${340 + Math.random() * 10},90%,${60 + p.life * 15}%)`;
      drawHeart(ctx, p.x, p.y, p.s * p.life);
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  })();
}
function drawHeart(ctx, x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * .3);
  ctx.bezierCurveTo(x, y, x - s * .5, y, x - s * .5, y + s * .3);
  ctx.bezierCurveTo(x - s * .5, y + s * .6, x, y + s * .8, x, y + s);
  ctx.bezierCurveTo(x, y + s * .8, x + s * .5, y + s * .6, x + s * .5, y + s * .3);
  ctx.bezierCurveTo(x + s * .5, y, x, y, x, y + s * .3);
  ctx.fill();
}

async function startCard() {
  heartTrail();
  await sleep(600);
  await typeText($('t1'), CONFIG.title, 80);
  await sleep(300);
  await typeText($('t2'), CONFIG.name, 110);
  await sleep(500);
  $('letterBtn').style.display = 'block';
}

/* ---------------- CẢNH 3: LOADING ---------------- */
async function startLoading() {
  go('loading');
  for (let i = 0; i <= 100; i++) {
    $('barFill').style.width = i + '%';
    $('pct').textContent = i + '%';
    await sleep(25 + Math.random() * 30);
  }
  await sleep(400);
  go('final');
  startFinal();
}

/* ---------------- CẢNH 4: TRÁI TIM HẠT 3D + CHỮ BAY ---------------- */
function startFinal() {
  // Vòng ảnh xoay 3D
  const ring = $('ring'), n = CONFIG.photos.length, r = Math.round(140 / 2 / Math.tan(Math.PI / n)) + 20;
  CONFIG.photos.forEach((src, i) => {
    const d = document.createElement('div');
    d.style.transform = `rotateY(${i * 360 / n}deg) translateZ(${r}px)`;
    d.appendChild(makePhoto(src));
    ring.appendChild(d);
  });

  // Chữ to đổi lần lượt
  let bi = 0;
  const big = $('bigText');
  big.textContent = CONFIG.bigTexts[0];
  setInterval(() => {
    big.style.opacity = 0;
    setTimeout(() => { bi = (bi + 1) % CONFIG.bigTexts.length; big.textContent = CONFIG.bigTexts[bi]; big.style.opacity = 1; }, 1000);
  }, 4000);

  const cv = $('space'), ctx = cv.getContext('2d');
  let W, H, scale;
  const resize = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; scale = Math.min(W, H) / 54; };
  resize(); addEventListener('resize', resize);

  // Tạo các hạt hình trái tim 3D
  const heart = [];
  for (let i = 0; i < 3500; i++) {
    const t = Math.random() * Math.PI * 2;
    const k = Math.pow(Math.random(), 0.35);        // đậm ở viền, thưa ở giữa
    const x = 16 * Math.pow(Math.sin(t), 3) * k + (Math.random() - .5) * 1.2;
    const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * k;
    const z = (Math.random() - .5) * 10 * Math.sqrt(1 - k * k + 0.05);
    heart.push({ x, y, z, hue: 320 + Math.random() * 30, l: 55 + Math.random() * 30 });
  }
  // Sao nền
  const stars = Array.from({ length: 220 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.4, p: Math.random() * 6 }));
  // Chữ bay từ xa lại gần
  const words = Array.from({ length: 22 }, () => newWord(true));
  function newWord(rand) {
    return { text: CONFIG.floatTexts[Math.random() * CONFIG.floatTexts.length | 0],
             x: (Math.random() - .5) * 2.2, y: (Math.random() - .5) * 1.8, z: rand ? Math.random() * 4 + .3 : 4.3 };
  }

  let rot = 0, time = 0;
  (function loop() {
    time += 0.016; rot += 0.008;
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.fillRect(0, 0, W, H);

    for (const s of stars) {
      ctx.fillStyle = `rgba(255,255,255,${0.3 + 0.7 * Math.abs(Math.sin(time + s.p))})`;
      ctx.fillRect(s.x * W, s.y * H, s.r + .5, s.r + .5);
    }

    // Nhịp đập trái tim
    const beat = 1 + 0.08 * Math.pow(Math.max(0, Math.sin(time * 4.5)), 6) + 0.04 * Math.sin(time * 9) ** 8;
    const cx = W / 2, cy = H * 0.44, cos = Math.cos(rot), sin = Math.sin(rot);
    ctx.globalCompositeOperation = 'lighter';
    for (const p of heart) {
      const x = p.x * cos - p.z * sin, z = p.x * sin + p.z * cos;
      const f = 60 / (60 + z);
      const sx = cx + x * scale * beat * f, sy = cy + p.y * scale * beat * f;
      ctx.fillStyle = `hsla(${p.hue},100%,${p.l}%,${0.55 * f})`;
      ctx.fillRect(sx, sy, 1.8 * f, 1.8 * f);
    }
    ctx.globalCompositeOperation = 'source-over';

    // Chữ bay
    words.sort((a, b) => b.z - a.z);
    for (let i = 0; i < words.length; i++) {
      const w = words[i];
      w.z -= 0.006;
      if (w.z < 0.25) { words[i] = newWord(false); continue; }
      const sx = cx + (w.x / w.z) * W * 0.35, sy = H / 2 + (w.y / w.z) * H * 0.35;
      const size = Math.min(40, 16 / w.z);
      const alpha = Math.min(1, (4.3 - w.z) / 1.2) * Math.min(1, (w.z - .25) * 3);
      ctx.font = `700 ${size}px 'Dancing Script', cursive`;
      ctx.textAlign = 'center';
      ctx.shadowColor = '#ff1f7a'; ctx.shadowBlur = 12;
      ctx.fillStyle = `rgba(255,190,225,${alpha})`;
      ctx.fillText(w.text, sx, sy);
      ctx.shadowBlur = 0;
    }
    requestAnimationFrame(loop);
  })();
}
